<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galaxy Spaceship</title>
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background: #0c0d14;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            display: flex;
            flex-direction: column;
        }

        #ui {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px 24px;
            padding: 12px 16px;
        }

        #ui h2,
        #ui p {
            margin: 0;
        }

        #ui h2 {
            font-size: 20px;
        }

        #ui p {
            color: #a4a8b8;
            font-size: 14px;
        }

        #ui #status {
            margin-left: auto;
        }

        #restart {
            padding: 6px 12px;
            border: 1px solid #2a2e3f;
            border-radius: 6px;
            background: #161927;
            color: #fff;
            font: inherit;
            font-size: 14px;
            cursor: pointer;
            touch-action: manipulation;
        }

        #restart:hover {
            background: #1f2336;
        }

        #game {
            flex: 1;
            min-height: 0;
            margin: 0 16px 16px;
            border: 1px solid #2a2e3f;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            cursor: crosshair;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
    </style>
</head>

<body>
    <div id="ui">
        <h2>🌌 Galaxy Spaceship Game</h2>
        <p>Drag mouse back from Rocket to aim & launch!</p>
        <p id="status">Status: Ready to Launch</p>
        <button id="restart" type="button" title="New game (R)">↻ New game</button>
    </div>
    <div id="game">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="js/MathVector.js"></script>
    <script src="js/CelestialBody.js"></script>
    <script src="js/PhysicsStep.js"></script>
    <script src="js/Spaceship.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
